<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 東京親子 8天7夜 雪國精華遊</title>
<style>
  :root {
    --bg-color: #f4f7f6;
    --text-color: #333333;
    --h1-color: #2c3e50;
    --card-bg: #ffffff;
    --card-shadow: rgba(0,0,0,0.05);
    --img-filter: brightness(1);
    --header-bg: #34495e;
    --header-text: #ffffff;
    --header-border: transparent;
    --text-muted: #333333;
    --tag-bg: #ecf0f1;
    --tag-text: #555555;
    --tag-border: transparent;
    --btn-bg: #3498db;
    --btn-hover: #2980b9;
    --btn-text: #ffffff;
    --notice-text: #ffffff;
  }
  
  body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --h1-color: #f5f5f5;
    --card-bg: #1e1e1e;
    --card-shadow: rgba(0,0,0,0.6);
    --img-filter: brightness(0.85);
    --header-bg: #1a202c;
    --header-text: #e2e8f0;
    --header-border: #2d3748;
    --text-muted: #cbd5e0;
    --tag-bg: #2d3748;
    --tag-text: #a0aec0;
    --tag-border: #4a5568;
    --btn-bg: #2b6cb0;
    --btn-hover: #3182ce;
    --notice-text: #ffffff;
  }

  body { font-family: 'Helvetica Neue', Arial, 'LiHei Pro', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
  h1 { text-align: center; color: var(--h1-color); margin-bottom: 20px; font-size: 1.8em; transition: color 0.3s; }
  .container { max-width: 800px; margin: 0 auto; position: relative; }
  
  .theme-switch-wrapper { display: flex; justify-content: flex-end; margin-bottom: 15px; }
  .theme-switch { cursor: pointer; padding: 10px 18px; background-color: var(--card-bg); color: var(--text-color); border: 2px solid var(--tag-bg); border-radius: 20px; font-weight: bold; font-size: 0.95em; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px var(--card-shadow); transition: all 0.3s ease; }
  .theme-switch:hover { background-color: var(--tag-bg); transform: translateY(-2px); }
  
  .notice-board { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; }
  .notice-card { flex: 1; min-width: 250px; padding: 15px; border-radius: 12px; color: var(--notice-text); box-shadow: 0 4px 10px var(--card-shadow); transition: box-shadow 0.3s; }
  .notice-pink { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); }
  body.dark-mode .notice-pink { background: linear-gradient(135deg, #c23b5b 0%, #ba4073 100%); }
  .notice-blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
  body.dark-mode .notice-blue { background: linear-gradient(135deg, #2a75b3 0%, #007a8f 100%); }
  .notice-card h3 { margin-top: 0; font-size: 1.1em; color: var(--notice-text); }
  .notice-card ul { padding-left: 20px; margin-bottom: 0; line-height: 1.6; }
  
  .day-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 12px var(--card-shadow); transition: transform 0.3s, background-color 0.3s, box-shadow 0.3s; }
  .day-card:hover { transform: translateY(-5px); }
  .card-img { width: 100%; height: 200px; object-fit: cover; display: block; border-bottom: 3px solid var(--bg-color); filter: var(--img-filter); transition: filter 0.3s; }
  .card-header { background-color: var(--header-bg); color: var(--header-text); padding: 12px 20px; font-weight: bold; font-size: 1.2em; border-bottom: 1px solid var(--header-border); transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
  .card-body { padding: 20px; }
  .card-body p { margin: 5px 0 15px; line-height: 1.6; color: var(--text-muted); transition: color 0.3s; }
  .budget-tag { display: inline-block; background-color: var(--tag-bg); padding: 6px 10px; border-radius: 6px; font-size: 0.9em; margin-right: 10px; margin-bottom: 10px; color: var(--tag-text); border: 1px solid var(--tag-border); transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
  
  .nav-links { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
  .nav-btn { display: block; text-align: center; background-color: var(--btn-bg); color: var(--btn-text); text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.95em; transition: background-color 0.2s; }
  .nav-btn:hover { background-color: var(--btn-hover); }
</style>
</head>
